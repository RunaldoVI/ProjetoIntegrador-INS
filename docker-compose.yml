version: "3.9"

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    env_file:
      - .env
    environment:
      - OLLAMA_DEBUG=error
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: database-mysql
    restart: always
    ports:
      - "${DB_PORT_EXTERNA:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  projeto:
    build:
      context: .
      dockerfile: Dockerfile
      target: projeto
    container_name: projeto-integrador
    volumes:
      - ./app:/app
      - ./logs:/app/logs
      - ./pdfs-excels:/app/pdfs-excels
    working_dir: /app
    command: ["bash", "/app/scripts/startup.sh"]
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy   # <- agora só arranca quando a API estiver healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: API
    ports:
      - "${API_PORT:-5000}:5000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health?deep=1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 10
    volumes:
      - ./app:/app
      - ./pdfs-excels:/app/pdfs-excels
      - ./logs:/app/logs
      - ./app/Frontend/static:/app/Frontend/static
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      CHAT_MODEL: mistral
      EMB_MODEL: nomic-embed-text
      TOPK: "5"
      OLLAMA_PROGRESS_LOG: /app/logs/ollama-progress.log
    depends_on:
      - mysql
      - qdrant

  frontend:
    image: nginx:latest
    container_name: projeto-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./app/Frontend:/usr/share/nginx/html:ro
    depends_on:
      api: 
        condition: service_healthy
    env_file:
      - .env

volumes:
  ollama-data:
  mysql_data:
  qdrant_data:
